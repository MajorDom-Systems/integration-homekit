[project]
name = "majordom-homekit"
version = "0.1.9"
description = "HomeKit integration for MajorDom — bridges HomeKit accessories into the MajorDom language."
authors = [
    { name = "Parker Industries" },
    { name = "Ehor Lukianov @Hexa-Hexagon", email = "85293779+Hexa-Hexagon@users.noreply.github.com" },
    { name = "Mark Parker @MarkParker5", email = "34688010+MarkParker5@users.noreply.github.com" },
]
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
keywords = ["majordom", "homekit", "hap", "apple", "smart-home", "home-automation", "iot", "integration", "accessory"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Home Automation",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13,<3.14"  # upper bound comes from parker-aiohomekit
dependencies = [
    "majordom-integration-sdk (>=0.3.0,<1.0)",
    "parker-aiohomekit (>=4.1.0,<5.0.0)",
]

[project.urls]
Homepage = "https://majordom.io"
Documentation = "https://docs.majordom.io/device-integration"
Repository = "https://github.com/MajorDom-Systems/integration-homekit"
Issues = "https://github.com/MajorDom-Systems/integration-homekit/issues"
"Commercial licensing" = "https://parker-industries.org/partnership"
"Parker Industries" = "https://parker-industries.org"

[dependency-groups]
dev = [
    "majordom-integration-sdk[discovery] (>=0.3.0,<1.0)",  # the tests browse over the SDK's DNS-SD provider
    "poethepoet (>=0.49.0,<1.0.0)",
    "ty",
    "ruff",
    "pip-audit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout",
    "pytest-repeat",
    "pytest-benchmark",
    "pytest-profiling",
    "pytest-resource-usage",
    "coverage",
    "pympler",
    "psutil",
    "faker",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.0"
packages = [{ include = "majordom_homekit" }]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
filterwarnings = ["once"]

[tool.coverage.run]
omit = ["tests/*"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I"]
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["E402"]


[tool.poe.tasks.install]
shell = """
poetry install
echo '#!/bin/sh\npoetry run poe check' > .git/hooks/pre-commit
chmod +x .git/hooks/pre-commit
echo "Pre-commit hook installed."
"""

[tool.poe.tasks.check]
shell = """
code=0

echo "\nRunning ruff lint:"
poetry run ruff check --fix || code=1

echo "\nRunning ruff format:"
poetry run ruff format || code=1

echo "\nRunning ty:"
poetry run ty check || code=1

echo "\nRunning pytest:"
poetry run pytest --cov=majordom_homekit --cov-report=xml || code=1

echo "\nRunning poetry build:"
poetry build || code=1

echo "\nRunning poetry check:"
poetry check || code=1

${ci:+git diff --exit-code} || code=1

exit $code
"""
args = [{ name = "ci", type = "boolean" }]
